name: Publish release

# How to publish an update:
#   1. Add an entry for the new version to CHANGELOG.md and push it to the main branch.
#   2. Open the Actions tab, pick "Publish release", press "Run workflow" and type the version
#      (for example 1.2.0).
# The workflow builds, tests and signs the app, then creates the GitHub release that the app's
# Settings > Updates screen looks at. Installed copies of the app offer it from then on.
# It needs your signing key in four repository secrets first (see docs/DEVELOPING.md: Signing and updates).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, like 1.2.0 (three numbers, no leading v)"
        required: true
        type: string
      notes:
        description: "Release notes. Leave empty to use this version's entry in CHANGELOG.md"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    # Only the default branch can be released, so an update never ships unreviewed work.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES_INPUT: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
      # Your private signing key. Android only installs an update that is signed with the same key
      # as the installed app, so every release must use this one key. Keep a safe copy of it.
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          set -euo pipefail
          # versionCode is major*10000 + minor*100 + patch, so minor and patch stop at 99.
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::'$VERSION' is not a valid version. Use three numbers like 1.2.0 (minor and patch up to 99)."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Pick a new version."
            exit 1
          fi
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          latest="${latest#v}"
          if [ -n "$latest" ]; then
            newest="$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)"
            if [ "$newest" != "$VERSION" ] || [ "$latest" = "$VERSION" ]; then
              echo "::error::$VERSION is not newer than the latest release ($latest). Installed apps only update to newer versions."
              exit 1
            fi
          fi

      - name: Prepare the release notes
        run: |
          set -euo pipefail
          if [ -n "$NOTES_INPUT" ]; then
            printf '%s\n' "$NOTES_INPUT" > notes.md
          else
            # The lines under "## [<version>]" in CHANGELOG.md, up to the next "## " heading.
            awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && index($0, "## ") == 1 { exit }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No release notes. Add a '## [$VERSION] - date' entry to CHANGELOG.md, or type notes into the workflow form."
            exit 1
          fi
          cat notes.md

      - name: Set up the signing key
        run: |
          set -euo pipefail
          missing=""
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The signing key is not set up. Add these repository secrets (Settings > Secrets and variables > Actions): RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. docs/DEVELOPING.md explains how. Without one stable key, installed apps could not install the update."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "::notice::Signing with the private key from the repository secrets."

      # JDK 21 runs Gradle and the tests. The app itself is compiled for Java 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew --no-daemon -PappVersion="$VERSION" testDebugUnitTest lintRelease assembleRelease

      - name: Check what was built
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$bt/apksigner" verify --print-certs "$apk"
          # Read all of aapt2's output, then keep its first line. (Piping into head would kill
          # aapt2 with SIGPIPE, and pipefail would then fail this step.)
          badging="$("$bt/aapt2" dump badging "$apk")"
          badging="${badging%%$'\n'*}"
          echo "$badging"
          case "$badging" in
            *"name='com.musicplayer.lite'"*"versionName='$VERSION'"*) ;;
            *) echo "::error::The APK does not report package com.musicplayer.lite, version $VERSION."; exit 1 ;;
          esac

      - name: Name the files
        run: |
          set -euo pipefail
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MusicPlayer-$VERSION.apk"
          cp "dist/MusicPlayer-$VERSION.apk" dist/MusicPlayer.apk
          (cd dist && sha256sum "MusicPlayer-$VERSION.apk" > "MusicPlayer-$VERSION.apk.sha256")
          cat "dist/MusicPlayer-$VERSION.apk.sha256"

      - name: Create the GitHub release
        run: |
          gh release create "v$VERSION" \
            "dist/MusicPlayer-$VERSION.apk" \
            "dist/MusicPlayer-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Music Player $VERSION" \
            --notes-file notes.md \
            --latest
          # A copy with a fixed name, added afterwards so that it is listed last (the app's updater
          # uses the first APK of a release). releases/latest/download/MusicPlayer.apk then always
          # gives the newest release.
          gh release upload "v$VERSION" dist/MusicPlayer.apk

      - name: Upload reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
