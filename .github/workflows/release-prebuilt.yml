name: Publish release from the APK in download/

# One click for the repository owner, when you want GitHub's Releases page (and the app's
# Settings > Updates) to show a version:
#   Actions > "Publish release from the APK in download/" > Run workflow > type the version, like 1.3.1.
#
# It publishes the APK that is already in the download/ folder (built and checked before it was
# committed) as a GitHub release with the version tag, that version's notes from CHANGELOG.md,
# its checksum, and a copy named MusicPlayer.apk, so that
#   https://github.com/<owner>/<repo>/releases/latest/download/MusicPlayer.apk
# always gives the newest release. It builds and signs nothing, so it needs no secrets.
# (To build and sign on GitHub with your own key instead, use the "Publish release" workflow.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, like 1.3.1 (the file download/MusicPlayer-<version>.apk must exist)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    # Only the default branch can be released, so an update never ships unreviewed work.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and the file
        run: |
          set -euo pipefail
          # versionCode is major*10000 + minor*100 + patch, so minor and patch stop at 99.
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::'$VERSION' is not a valid version. Use three numbers like 1.3.1 (minor and patch up to 99)."
            exit 1
          fi
          apk="download/MusicPlayer-$VERSION.apk"
          if [ ! -f "$apk" ] || [ ! -f "$apk.sha256" ]; then
            echo "::error::$apk and $apk.sha256 must both be in the repository (on the default branch)."
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          latest="${latest#v}"
          if [ -n "$latest" ]; then
            newest="$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)"
            if [ "$newest" != "$VERSION" ] || [ "$latest" = "$VERSION" ]; then
              echo "::error::$VERSION is not newer than the latest release ($latest). Installed apps only update to newer versions."
              exit 1
            fi
          fi
          # The checksum file must match the APK.
          (cd download && sha256sum -c "MusicPlayer-$VERSION.apk.sha256")
          # The APK must really be this version of this app, and be signed.
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$bt/apksigner" verify --print-certs "$apk"
          # Read all of aapt2's output, then keep its first line. (Piping into head would kill
          # aapt2 with SIGPIPE, and pipefail would then fail this step.)
          badging="$("$bt/aapt2" dump badging "$apk")"
          badging="${badging%%$'\n'*}"
          echo "$badging"
          case "$badging" in
            *"name='com.musicplayer.lite'"*"versionName='$VERSION'"*) ;;
            *) echo "::error::The APK does not report package com.musicplayer.lite, version $VERSION."; exit 1 ;;
          esac

      - name: Prepare the release notes
        run: |
          set -euo pipefail
          # The lines under "## [<version>]" in CHANGELOG.md, up to the next "## " heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No release notes. Add a '## [$VERSION] - date' entry to CHANGELOG.md first."
            exit 1
          fi
          cat notes.md

      - name: Create the GitHub release
        run: |
          set -euo pipefail
          mkdir out
          cp "download/MusicPlayer-$VERSION.apk" "download/MusicPlayer-$VERSION.apk.sha256" out/
          cp "download/MusicPlayer-$VERSION.apk" out/MusicPlayer.apk
          # The versioned file and its checksum first: the app's updater uses the first APK of a release.
          gh release create "v$VERSION" \
            "out/MusicPlayer-$VERSION.apk" \
            "out/MusicPlayer-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Music Player $VERSION" \
            --notes-file notes.md \
            --latest
          # The copy with a fixed name is added afterwards, so it is listed last.
          gh release upload "v$VERSION" out/MusicPlayer.apk
