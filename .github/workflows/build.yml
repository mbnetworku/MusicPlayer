name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21 runs Gradle and the tests. The app itself is compiled for Java 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        run: ./gradlew --no-daemon assembleRelease

      # Uploaded before the tests run, so the APK is always available.
      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Upload reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
