plugins {
    id 'com.android.application'
}

// Version: set it in one place. `-PappVersion=1.18.0` overrides the default (the release
// workflow does this). versionCode is derived: major * 10000 + minor * 100 + patch.
def appVersion = (project.findProperty('appVersion') ?: '1.18.0').toString()
def versionParts = appVersion.tokenize('.').collect { (it.replaceAll('[^0-9]', '') ?: '0') as int }
while (versionParts.size() < 3) versionParts << 0
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Signing. Android only installs an update over an app signed with the same key, so releases
// need one stable key of your own: create keystore.properties (git-ignored) with storeFile,
// storePassword, keyAlias and keyPassword. The release workflow builds that file from
// repository secrets (see docs/DEVELOPING.md: Signing and updates). Without it the build is signed with
// the local debug key, which is enough to install and try the app but differs from machine to
// machine, so such builds cannot update each other.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
} else {
    logger.warn('No keystore.properties: the release APK is signed with the debug key, so it cannot update a build made elsewhere.')
}

android {
    namespace 'com.musicplayer.lite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.musicplayer.lite'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Smaller APK: no signing-blob metadata, no extra packaging files.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packaging {
        resources {
            excludes += ['/META-INF/**', '/kotlin/**']
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            // The screens are built many times over in the tests; the default memory is too small for that.
            all {
                maxHeapSize = '1536m'
            }
            // Robolectric smoke tests need the merged manifest and resources.
            includeAndroidResources = true
            all {
                // Print the real cause of a failing test in the build log (useful on CI).
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                    showCauses true
                    showStackTraces true
                }
            }
        }
    }
}

dependencies {
    // Intentionally no runtime dependencies: framework APIs only.
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.robolectric:robolectric:4.17') {
        // Only needed for pixel-accurate rendering tests, which this project does not run.
        exclude group: 'org.robolectric', module: 'nativeruntime-dist-compat'
    }
}
